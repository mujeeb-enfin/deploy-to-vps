name: Feature request
description: Suggest a new strategy, input, or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Tell us what you would like to see and why it matters.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What limitation are you hitting? What workflow would this unblock?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the action change? New input? New strategy?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using today.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, examples from other actions, etc.