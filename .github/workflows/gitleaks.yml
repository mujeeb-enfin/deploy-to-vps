name: gitleaks

# Scans the repository for hard-coded secrets, API keys, tokens, and credentials.
# Uses gitleaks/gitleaks-action. Runs on every push and PR; full history scan
# runs nightly and on push to main.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly deep scan of the full git history.
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the deep-history scanner on nightly runs and on push to main;
          # PRs use the default (working-tree + HEAD) for speed.
          GITLEAKS_ENABLE_HISTORY: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
