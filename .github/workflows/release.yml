name: Deploy to VPS

# EXAMPLE consumer workflow for the default `node-docker` strategy.
# Copy into YOUR repository and edit the `with:` values.
# See README.md for the full set of strategy examples.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag, branch, or SHA) to deploy.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    # This repository is the ACTION ITSELF, not a deployable app. Without this
    # guard, publishing a release here would fire a real SSH deploy of a path
    # that does not exist and mark the release with a failed check.
    # DELETE THIS LINE when you copy the workflow into your own repository.
    if: github.repository != 'mujeeb-enfin/deploy-to-vps'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to VPS
        uses: mujeeb-enfin/deploy-to-vps@v1
        with:
          vps_host: ${{ secrets.VPS_HOST }}
          vps_username: ${{ secrets.VPS_USERNAME }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}
          project_path: ~/projects/myapp
          strategy: node-docker
          node_version: '22'
          ref: ${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
