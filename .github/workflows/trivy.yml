name: Trivy

# Scans the repository filesystem for known vulnerabilities in OS packages,
# libraries, and IaC misconfigurations (workflow YAML, action.yml, .yamllint.yml).
# Uses aquasecurity/trivy-action pinned to a known commit SHA.

on:
  push:
    branches: [main]
  # Pull requests are covered by pr-security.yml, which reports every scanner
  # through one attributed comment and one required status check. Running here
  # too produced a second, contradictory verdict on the same pull request.
  schedule:
    # Weekly vuln-database refresh.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          # Skip the dependency-check-report output dir from recursive scans.
          ignore-dirs: 'reports/,node_modules/,dist/,build/,.git/'
          # Misconfigurations on workflow YAML files.
          scanners: 'vuln,misconfig,secret,license'
          # Fail the build on CRITICAL or HIGH findings.
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs