name: Deploy to VPS (develop branch)

# EXAMPLE consumer workflow — copy this into YOUR repository and edit the
# `with:` values. It is inert here: this repository has no `develop` branch.
#
# Triggers on every push to the develop branch.
# Uses the same multi-strategy action as release.yml; defaults to node-docker.
# See README.md for strategy options (node-pm2, node-docker, static, custom).

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-develop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    # This repository is the ACTION ITSELF, not a deployable app. Without this
    # guard, publishing a release here would fire a real SSH deploy of a path
    # that does not exist and mark the release with a failed check.
    # DELETE THIS LINE when you copy the workflow into your own repository.
    if: github.repository != 'mujeeb-enfin/deploy-to-vps'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to VPS
        uses: mujeeb-enfin/deploy-to-vps@v1
        with:
          vps_host: ${{ secrets.VPS_HOST }}
          vps_username: ${{ secrets.VPS_USERNAME }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}
          # Absolute or ~-relative path to the git checkout on YOUR VPS.
          project_path: ~/projects/myapp
          strategy: node-docker
          node_version: '22'
          ref: ${{ github.ref_name }}
