name: OWASP Dependency-Check

# Scans the action's pinned third-party GitHub Actions and the embedded
# shell script's external dependencies for known CVEs using the OWASP
# Dependency-Check tool via the official GitHub Action.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly CVE-database refresh.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate project info
        id: project-info
        shell: bash
        run: |
          echo "name=$(echo '${{ github.repository }}' | awk -F/ '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always 2>/dev/null || echo '0.0.0')" >> "$GITHUB_OUTPUT"

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          projectName: ${{ steps.project-info.outputs.name }}
          projectVersion: ${{ steps.project-info.outputs.version }}
          path: '.'
          format: 'HTML,JSON,SARIF'
          args: >
            --enableRetired
            --enableExperimental
            --nvdDatafeed
            --failOnCVSS 7.0

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload HTML + JSON reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: owasp-reports
          path: reports/
          retention-days: 30