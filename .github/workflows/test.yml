name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: actionlint
        uses: rhysd/actionlint@011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7 # main

      - name: yamllint
        uses: ibiqlik/action-yamllint@b74a2626a991d676b6ec243a6458ff86cccf2d2d # master
        with:
          config_file: .yamllint.yml

      - name: shellcheck (embedded script)
        shell: bash
        run: |
          set -euo pipefail
          # Extract the embedded shell script from action.yml and shellcheck it.
          awk '
            /^          script: \|/ { in_script=1; next }
            in_script && /^          [a-zA-Z]/ { in_script=0 }
            in_script { sub(/^          /, ""); print }
          ' action.yml > /tmp/embedded.sh
          chmod +x /tmp/embedded.sh
          # Dry-run mode is bash-only, so use bash invocation that works under shellcheck.
          docker run --rm -v "$PWD:/src" -w /src koalaman/shellcheck:stable /tmp/embedded.sh
